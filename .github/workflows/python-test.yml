name: Python Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp-server-py/requirements.txt
      - name: Install dependencies
        working-directory: mcp-server-py
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: mcp-server-py
        run: python -m unittest discover -s tests -v
