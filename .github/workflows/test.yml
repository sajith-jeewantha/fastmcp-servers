name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: mcp-server-ts/package-lock.json
      - name: Install dependencies
        working-directory: mcp-server-ts
        run: npm ci
      - name: Run tests
        working-directory: mcp-server-ts
        run: npm test
